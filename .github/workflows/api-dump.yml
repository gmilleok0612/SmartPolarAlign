name: nina-api-dump
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
permissions:
  contents: write
jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (to collect NINA assemblies)
        shell: pwsh
        run: dotnet build PolarAlignLive.csproj -c Release -o out -p:CopyLocalLockFileAssemblies=true
      - name: Dump NINA API by reflection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $names = @('CaptureSequence','ICameraMediator','IImagingMediator','ICaptureSolver','IImageSolver','IPlateSolver','PlateSolveParameter','CaptureSolverParameter','ITelescopeMediator','TelescopeInfo','CameraInfo','IExposureData','IPlateSolverFactory','PlateSolveResult','IImageData','IImageDataFactory','PierSide')
          $sb = New-Object System.Text.StringBuilder
          $flags = [System.Reflection.BindingFlags]'Public,Instance,Static,DeclaredOnly'
          foreach ($dll in Get-ChildItem out -Filter 'NINA*.dll') {
            try { $asm = [System.Reflection.Assembly]::LoadFrom($dll.FullName) } catch { [void]$sb.AppendLine("//// LOADFAIL " + $dll.Name + " " + $_.Exception.Message); continue }
            try { $types = $asm.GetTypes() } catch [System.Reflection.ReflectionTypeLoadException] { $types = $_.Exception.Types | Where-Object { $_ } } catch { continue }
            foreach ($t in $types) {
              if ($names -contains $t.Name) {
                [void]$sb.AppendLine("//// TYPE " + $t.FullName + "   [" + $dll.Name + "]")
                try { [void]$sb.AppendLine("  interfaces: " + (($t.GetInterfaces() | ForEach-Object { $_.Name }) -join ', ')) } catch {}
                try {
                  if ($t.IsEnum) { [void]$sb.AppendLine("  enum values: " + (([Enum]::GetNames($t)) -join ', ')) }
                  foreach ($m in $t.GetMembers($flags)) { [void]$sb.AppendLine("  " + $m.MemberType + " " + $m.ToString()) }
                } catch { [void]$sb.AppendLine("  MEMBERFAIL " + $_.Exception.Message) }
              }
            }
          }
          New-Item -ItemType Directory -Force -Path apidump | Out-Null
          $sb.ToString() | Set-Content apidump/nina-api.txt -Encoding utf8
          $global:LASTEXITCODE = 0
          exit 0
      - name: Commit result
        shell: pwsh
        run: |
          git config user.name "api-dump"
          git config user.email "api-dump@users.noreply.github.com"
          git add apidump/nina-api.txt
          git commit -m "NINA API dump [skip ci]"
          git push
