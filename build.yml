name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build PolarAlignLive.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PolarAlignLive-plugin
          path: |
            out/PolarAlignLive.dll
            out/PolarAlignLive.pdb
